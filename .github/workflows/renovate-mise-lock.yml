name: renovate-mise-lock

on:
  push:
    branches:
      - 'renovate/**'

# Avoid overlapping runs racing to push to the same branch. Stays here rather than in the shared
# workflow because concurrency governs the run these triggers create.
concurrency:
  group: renovate-mise-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mise-lock:
    permissions:
      # Must be granted here. `permissions` in the called workflow is a ceiling on what the
      # caller allowed, not a grant of its own, so without this the job regenerates mise.lock
      # and then cannot push it.
      contents: write
    uses: iglootools/common-guidelines/.github/workflows/reusable-renovate-mise-lock.yml@1d09a131ac5e8a2bc969b0bea48513ae4bb40637 # v1.5.0
    with:
      # Pinned here, not in the shared workflow: project-setup.md requires it to match the
      # version this project's mise.lock was generated with, and the custom manager below lives
      # in this repository's renovate.json. The input is named `version` because that is what
      # that manager matches — see the shared workflow's input description.
      # renovate: datasource=github-releases depName=jdx/mise
      version: 2026.9.2
