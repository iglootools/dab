name: check-links

on:
  # Manually trigger the workflow using
  # gh workflow run check-links.yml # --ref <branch>
  # gh run list --workflow check-links.yml # --branch <branch>
  workflow_dispatch:
  repository_dispatch:
  schedule:
    - cron: "00 18 * * 1"

concurrency:
  # A link check only reads and reports, so a run in flight can be abandoned and redone. This
  # stays here rather than moving into the shared workflow because concurrency governs the run
  # these triggers create. See the concurrency section of project-setup.md in common-guidelines.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && format('main-{0}', github.event.workflow_run.head_sha || github.sha) || github.ref }}
  cancel-in-progress: true

jobs:
  check-links:
    permissions:
      # Must be granted here. `permissions` in the called workflow is a ceiling on what the
      # caller allowed, not a grant of its own, so omitting this 403s the issue step on the
      # first run that finds a broken link — the run you most wanted the report from.
      issues: write
    # The job itself lives in common-guidelines so a fix reaches every project at once. The
    # hosts this repository excludes stay in its own .lycheeignore, which the shared job reads
    # because checkout there resolves to the calling repository. Pinned to a commit SHA for the
    # reason project-setup.md gives for actions, with the version in the trailing comment so
    # Renovate can raise the update.
    uses: iglootools/common-guidelines/.github/workflows/reusable-check-links.yml@4e8d3ac64d42331d92f210751a6fff70a9e1da12 # v1.1.1
